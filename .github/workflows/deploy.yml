name: deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./

    steps:
      - name: check code
        uses: actions/checkout@4

      - name: setup node js
        uses: actions/setup-node@4
        with:
          node-version: 22

      - name: install deps
        run: npm ci

      - name: run test
        run: npm test

      - name: deploy to ec2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC_HOST }}
          username: ${{ secrets.EC_USER }}
          key: ${{ secrets.EC_SSH_KEY }}

      - name: run code
        run: ./deploy.sh
