name: deploy

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: check code
        uses: actions/checkout@v4

      - name: setup node js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install deps
        run: npm ci

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: deploy to ec2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC_HOST }}
          username: ${{ secrets.EC_USER }}
          key: ${{ secrets.EC_SSH_KEY }}
          script: |
            if [ ! -d "/home/ubuntu/deployment/.git" ]; then
              git clone -b main https://github.com/ansh-dot-labs/deployment.git /home/ubuntu/deployment
            else
              cd /home/ubuntu/deployment
              git pull --ff-only origin main
            fi

            cd /home/ubuntu/deployment

            npm ci
            npm run build

            echo "Deployment successfully"
